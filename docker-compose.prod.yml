# Production stack built from source: app + Postgres. Copy .env.example to .env and set
# POSTGRES_PASSWORD first, then:
#   docker compose -f docker-compose.prod.yml up -d --build
# (The Tailscale + Watchtower stack in deploy/ is the recommended way to run it.)
name: brick-bin-local

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: bricks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bricks
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bricks -d bricks']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bricks:${POSTGRES_PASSWORD}@db:5432/bricks
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      INSTRUCTIONS_MAX_MB: ${INSTRUCTIONS_MAX_MB:-200}
      REBRICKABLE_PAGE_FETCH: ${REBRICKABLE_PAGE_FETCH:-false}
      # Set to true once the app is served over HTTPS (for example with tailscale serve).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Passed on only when set in .env (or the shell); unset, the app keeps its own default.
      AUTO_MIGRATE:
      ALLOWED_ORIGINS:
      APP_VERSION:
      REBRICKABLE_DOWNLOADS_PAGE:
      REBRICKABLE_ALLOWED_ORIGINS:
      CATALOG_IMAGE_ORIGIN:
      UPC_BASE_URL:
      # DATA_DIR is not passed on: it stays /data (set in the image), where the app-data volume is.
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - app-data:/data

volumes:
  db-data:
  app-data:
