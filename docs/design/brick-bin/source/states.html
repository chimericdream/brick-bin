<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Brick Bin</title><link rel="stylesheet" href="style.css">
<style>.slot{aspect-ratio:3/2;border:2px dashed var(--app-control);border-radius:10px;display:grid;place-items:center;color:var(--app-muted);font-size:13px;text-align:center;padding:10px}
.loc{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--app-rule)}.loc.l1{padding-left:28px}.loc.l0{font-weight:650}
.trow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--app-rule)}.trow:last-child{border-bottom:0}
@media (max-width:899px){.trow{grid-template-columns:72px minmax(0,1fr)}.trow .acts{grid-column:1/-1}}</style></head>
<body><div id="app"></div>
<script src="data.js"></script><script src="art.js"></script><script src="ui.js"></script>
<script>
/* ?s=empty|trash|delete|people|places|404|more */
const S = Q.get('s') || 'empty';
const find = (id) => SETS.find((x) => x.id === id);
let o = { page: 'library', html: '' };
if (S === 'empty') {
  o.html = `${head('Library', '0 sets · 0 copies', `<a class="btn pri hide-m" href="${href('add.html')}">${I('plus')}Add set</a>`)}
  <div class="lib"><aside class="facets desk"><b style="font-size:16px">Filters</b><p class="muted sm" style="margin-top:8px">Filters appear when you have sets.</p></aside><section>
  <div class="plank" style="--cols:${PH ? 2 : 3}"><div class="slot">${I('plus')}<span>Your first set<br>goes here</span></div><div class="slot" style="opacity:.6"></div>${PH ? '' : '<div class="slot" style="opacity:.35"></div>'}</div>
  <div class="empty" style="margin-top:6px"><h3>Your bin is empty</h3>Add a set by searching the catalog, scanning its barcode, or typing it in. Off-brand sets work too.
  <div class="row" style="justify-content:center;flex-wrap:wrap;gap:10px"><a class="btn pri" href="${href('add.html')}">${I('plus')}Add your first set</a><a class="btn">${I('up2')}Import a collection</a></div>
  <p class="sm" style="margin-top:16px">Set lookup needs the catalog. <a href="${href('catalog.html?state=never')}" style="text-decoration:underline;color:var(--app-accent-ink)">Import it in Settings</a>.</p></div></section></div>`;
} else if (S === 'trash') {
  const items = [['s12', 'Set', 'Tower Crane (Mould King 18005)', 'Dana', '14 Nov', 'Deleted with its 1 copy and 1 instruction PDF', true], ['s15', 'Copy', 'Heritage Tram, Wren\'s second copy', 'Theo', '9 Nov', 'Restore the set first: it is in the trash too.', false], ['s03', 'Instructions', 'Building book 2 · Dune Rover 4x4', 'Dana', '2 Nov', 'PDF, 21.0 MB', true], ['s14', 'Wishlist item', 'Beach Buggy (CaDA C51019)', 'Wren', '30 Oct', 'Removed by Wren. Restoring puts it back on her list.', true]];
  o.html = `${head('Trash', 'Deleted items stay here for 30 days, then are removed for good. Their files are removed with them.', `<button class="btn danger">${I('trash')}Empty trash</button>`)}
  <div class="sets">${subnav('trash')}<div class="card pad" style="padding-top:4px;padding-bottom:4px">${items.map(([id, k, t, by, d, note, ok]) => `<div class="trow"><div class="cover" style="border-radius:6px">${boxArt(find(id))}</div><div style="min-width:0"><div class="row" style="gap:8px"><span class="b plain">${k}</span><b>${t}</b></div><div class="sm muted" style="margin-top:3px">Deleted by ${by} on ${d} · ${note}</div></div>
  <div class="acts row"><button class="btn sm ${ok ? '' : 'dis'}" ${ok ? '' : 'disabled'}>${I('undo')}Restore</button>${ok ? '' : `<button class="btn sm">Restore the set first</button>`}<button class="btn sm ghost danger">Delete for good</button></div></div>`).join('')}</div></div>`;
  o.page = 'trash';
} else if (S === 'delete') {
  const s = find('s15');
  o.html = `${head('Heritage Tram', 'CaDA C66011W', '', `<a href="#">Library</a>`)}<div class="detailtop"><div class="cover">${boxArt(s)}</div><div></div></div>`;
  const body = `<p style="margin-bottom:12px">Wren's copy of <b>Heritage Tram</b> goes to the trash. You can restore it for 30 days.</p><ul class="sm muted" style="padding-left:18px;display:grid;gap:4px;margin-bottom:6px"><li>Its missing-piece list (2 pieces) goes with it and leaves the shopping list.</li><li>The set page and its instructions stay, since the set is still in the library.</li></ul>`;
  o.after = PH ? `<div class="scrim"></div><div class="sheet" role="alertdialog" aria-label="Delete copy"><div class="grab"></div><div class="sh"><h2>Move this copy to the trash?</h2></div><div class="sb">${body}</div><div class="sf"><button class="btn">Cancel</button><button class="btn danger" style="background:var(--app-danger);color:#fff;border-color:var(--app-danger)">${I('trash')}Move to trash</button></div></div>`
    : `<div class="scrim"></div><div class="dialog" role="alertdialog" aria-label="Delete copy"><h2>Move this copy to the trash?</h2>${body}<div class="df"><button class="btn">Cancel</button><button class="btn" style="background:var(--app-danger);color:#fff;border-color:var(--app-danger)">${I('trash')}Move to trash</button></div></div>`;
} else if (S === 'people') {
  const P = [['Dana', 'Admin', 'dana@marlowe.example', 'Owns 12 copies'], ['Theo', 'Member', 'theo@marlowe.example', 'Owns 10 copies'], ['Wren', 'Kid profile', '9 years old', 'Sees the library, instructions and her own wishlist'], ['Milo', 'Kid profile', '12 years old', 'Sees the library, instructions and his own wishlist']];
  o.html = `${head('People', 'Who can sign in. Kid profiles are read-only except for their own wishlist, and never see prices.', `<button class="btn pri">${I('plus')}Add person</button>`)}
  <div class="sets">${subnav('people')}<div class="card pad" style="padding-top:6px;padding-bottom:6px">${P.map(([n, r, e, d]) => `<div class="insrow">${avatar(n, 40)}<div class="sp"><div style="font-weight:650">${n} <span class="b ${r === 'Kid profile' ? 'wish' : 'plain'}" style="margin-left:6px">${I(r === 'Kid profile' ? 'eyeoff' : 'user')}${r}</span></div><div class="sm muted">${e} · ${d}</div></div><button class="btn sm">Edit</button></div>`).join('')}</div></div>`;
  o.page = 'people';
} else if (S === 'places') {
  const cnt = (p) => COPIES.filter((c) => c.loc === p).length;
  const rows = LOCS.map((l) => { const kids = l.kids.map((k) => ({ n: k.n, c: cnt(l.n + ' › ' + k.n) })); return { n: l.n, kids, c: kids.reduce((a, k) => a + k.c, 0) }; });
  console.assert(rows.reduce((a, r) => a + r.c, 0) === COPIES.length, 'places add up to copies');
  o.html = `${head('Places', 'Where copies live. A place with copies in it cannot be deleted.', `<button class="btn pri">${I('plus')}Add place</button>`)}
  <div class="sets">${subnav('places')}<div class="card pad">${rows.map((r) => `<div class="loc l0">${I('pin')}${r.n}<span class="sp"></span><span class="muted sm">${r.c} copies</span><button class="btn sm ghost">Edit</button></div>${r.kids.map((k) => `<div class="loc l1">${I('right')}${k.n}<span class="sp"></span><span class="muted sm">${k.c} ${k.c === 1 ? 'copy' : 'copies'}</span>${k.c ? `<span class="b plain" title="Has copies">${I('lock')}In use</span>` : `<button class="btn sm ghost danger">${I('trash')}Delete</button>`}</div>`).join('')}`).join('')}</div></div>`;
  o.page = 'places';
} else if (S === '404') {
  o.html = `<div style="max-width:560px;margin:8vh auto 0;text-align:center"><div class="plank" style="--cols:3;max-width:420px;margin:0 auto 26px"><div class="tile"><div class="frame">${boxArt(find('s19'))}</div></div><div class="slot">?</div><div class="tile"><div class="frame">${boxArt(find('s16'))}</div></div></div>
  <h1 style="font-size:32px">That page is not in the bin</h1><p class="muted" style="margin:10px 0 22px">The link may be old, or the set was moved to the trash. If a page should be here, ask an admin.</p>
  <div class="row" style="justify-content:center;gap:10px;flex-wrap:wrap"><a class="btn pri" href="${href('library.html')}">${I('grid')}Back to the library</a><a class="btn" href="${href('wishlist.html')}">Wishlist</a></div></div>`;
} else if (S === 'more') {
  const it = (ic, l, h, extra) => `<a class="insrow" href="${href(h)}" style="min-height:56px">${I(ic)}<span class="sp" style="font-weight:600">${l}</span>${extra || ''}${I('right')}</a>`;
  o.html = `<h1 style="font-size:24px;margin-bottom:12px" class="hide-m">More</h1><div class="card pad" style="padding-top:0;padding-bottom:0">${it('chart', 'Collection and value', 'collection.html')}${it('people' === 1 ? '' : 'users', 'People', 'people.html')}${it('pin', 'Places', 'places.html')}${it('tag', 'Brands and themes', 'brands.html')}${it('disk', 'Catalog', 'catalog.html', '<span class="sm muted">Imported 15 Nov</span>')}${it('clock', 'Activity', 'activity.html')}${it('trash', 'Trash', 'trash.html', '<span class="b plain">4</span>')}</div>
  <div class="card pad" style="margin-top:14px"><div class="row">${avatar('Dana', 40)}<div class="sp"><b>Dana</b><div class="sm muted">Admin · ${HOUSEHOLD}</div></div><button class="btn sm">Sign out</button></div><div class="row" style="margin-top:14px"><span class="sp" style="font-weight:600">Appearance</span><div class="seg"><button aria-pressed="true">Auto</button><button aria-pressed="false">Light</button><button aria-pressed="false">Dark</button></div></div></div>`;
  o.page = 'more';
}
shell({ page: o.page, title: { empty: '', trash: 'Trash', delete: 'Heritage Tram', people: 'People', places: 'Places', 404: 'Not found', more: 'More' }[S] || '', back: S === 'trash' || S === 'people' || S === 'places' ? href('more.html') : S === 'delete' ? href('library.html') : undefined, html: o.html, after: o.after, tabs: S === '404' ? false : undefined });
if (PH && S === 'empty') document.querySelector('.topbar').innerHTML = `<a class="brand" href="library.html">${MARK}Brick Bin</a>`;
</script></body></html>
