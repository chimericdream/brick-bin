<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Set · Brick Bin</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"></div>
<script src="data.js"></script><script src="art.js"></script><script src="ui.js"></script>
<script>
/* ?id=s03  ?menu=1 (build-state menu open on copy 1)  ?role=kid */
const s = SETS.find((x) => x.id === (Q.get('id') || 's03'));
const DESC = { s03: 'A 4x4 desert explorer with working steering, a suspension that really moves, and a roof rack that carries the folding camp. Two build routes in the booklet: the rover and a dune buggy.', s02: 'A small harbour crane that slides along its rail and lifts three containers. The cab turns on a gear ring.' };
const FIND = { LEGO: 'LEGO.com', 'Mould King': 'Mould King site', CaDA: 'CaDA site', COBI: 'COBI site', BlueBrixx: 'BlueBrixx site', Lumibricks: 'Lumibricks site' };
const theme = s.theme.map((t, i) => `<a href="${href('library.html?th=' + encodeURIComponent(s.theme[0]))}">${t}</a>`).join(I('right'));
const crumbs = `<a href="${href('library.html')}">Library</a>${I('right')}<a href="${href('library.html?brand=' + encodeURIComponent(s.brand))}">${s.brand}</a>${I('right')}${theme}`;
const stateMenu = () => `<div class="menu" role="menu" aria-label="Build state">${Object.keys(STATES).map((k, i) => `<button role="menuitemradio" aria-checked="${k === 'built'}">${I(STATE_ICON[k])}<span class="t">${STATES[k].l}<small>${STATES[k].d}</small></span>${k === 'built' ? `<span class="chk">${I('check')}</span>` : ''}</button>`).join('')}</div>`;
function copyCard(c, i) {
  const comp = completeness(c);
  const st = KID ? stateBadge(c.state, true) : `<span class="menuhost"><button class="stbtn" aria-haspopup="menu" aria-expanded="${!!(Q.get('menu') && i === 0)}">${stateBadge(c.state)}</button>${Q.get('menu') && i === 0 ? stateMenu() : ''}</span>`;
  const compHtml = comp.k === 'sealed' ? `<span class="b sealed">${I('lock')}Sealed</span>` : comp.k === 'missing' && KID ? `<span class="b missing lg">${I('warn')}${comp.t}</span>` : comp.k === 'missing' ? `<a href="${href('missing.html?view=list')}" class="b missing lg" style="text-decoration:underline">${I('warn')}${comp.t}${I('right')}</a>` : compBadge(comp, true);
  const money_ = KID ? '' : `<div><div class="l">Paid / value</div><div class="v">${USD(c.paid)} / ${USD(c.value)}</div><div class="xs muted">valued ${c.valued ? new Date(c.valued + '-15').toLocaleString('en-US', { month: 'short', year: 'numeric' }) : '-'}</div></div>`;
  return `<article class="card copycard" aria-label="Copy ${i + 1}">
  <div class="who">${avatar(c.owner)}<div><div>${c.owner ? c.owner + "'s copy" : 'Ours'}${s.copies.length > 1 ? ` <span class="muted" style="font-weight:400">· copy ${i + 1} of ${s.copies.length}</span>` : ''}</div><div class="sm muted" style="font-weight:400;display:flex;gap:5px;align-items:center">${I('pin')}${c.loc}</div></div></div>
  <div class="row" style="justify-content:flex-end">${st}</div>
  <div class="grid"><div><div class="l">Pieces</div><div class="v">${compHtml}</div></div>
  <div><div class="l">Box and booklets</div><div class="v" style="display:grid;gap:3px"><span class="flag ${c.box ? '' : 'no'}">${I(c.box ? 'check' : 'x')}${c.box ? 'Has the box' : 'No box'}</span><span class="flag ${c.ins ? '' : 'no'}">${I(c.ins ? 'check' : 'x')}${c.ins ? 'Has paper booklets' : 'No paper booklets'}</span></div></div>
  <div><div class="l">Condition notes</div><div class="v" style="font-weight:400">${c.note || '<span class="muted">None</span>'}</div></div>
  ${money_ || `<div><div class="l">Acquired</div><div class="v">${c.acq ? new Date(c.acq).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }) : '-'}</div></div>`}</div>
  ${KID && c.m.length ? `<div style="grid-column:1/-1;padding-top:12px;border-top:1px solid var(--app-rule)"><div class="lab" style="margin-bottom:6px">Missing from this copy <span class="muted" style="font-weight:400">(read only)</span></div>${c.m.map((r) => `<div class="row" style="gap:12px;padding:6px 0">${r[0] === 'other' ? `<div class="pfr" style="width:64px;flex:none"><div class="noart">${I('tag')}</div></div>` : `<div class="pfr" style="width:64px;flex:none">${partImg(r[0], r[1])}</div>`}<div class="sp" style="min-width:0"><div style="font-weight:600">${r[0] === 'other' ? r[1] : PART[r[0]].n}</div>${r[0] === 'other' ? '' : `<div class="colrow sm"><span class="sw" style="background:${COL[r[1]].h}"></span><span>${COL[r[1]].n}</span> <span class="muted" style="font-weight:400">· ${r[0]}</span></div>`}</div><b style="font:700 18px var(--head)">×${r[2]}</b></div>`).join('')}</div>` : ''}
  ${KID ? '' : `<div class="row" style="grid-column:1/-1;flex-wrap:wrap"><button class="btn sm">${I('edit')}Edit copy</button><a class="btn sm" href="${href('missing.html')}">${I('warn')}Missing pieces</a><button class="btn sm ghost danger" style="margin-left:auto">${I('trash')}Remove copy</button></div>`}
  </article>`;
}
const insRows = s.ins ? `<div class="insrow"><span class="pdf">PDF</span><div class="sp"><div style="font-weight:650">Building book 1</div><div class="sm muted">Saved from lego-style-instructions.example · 38.4 MB · added 3 Jan 2024</div></div><a class="btn sm" href="#">${I('ext')}Open</a></div>
  ${s.ins > 1 ? `<div class="insrow"><span class="pdf">PDF</span><div class="sp"><div style="font-weight:650">Alternate build: dune buggy</div><div class="sm muted">Uploaded · 21.0 MB · added 3 Jan 2024</div></div><a class="btn sm" href="#">${I('ext')}Open</a></div>` : ''}
  <div class="insrow"><span class="pdf link">LINK</span><div class="sp"><div style="font-weight:650">Maker's page for this set</div><div class="sm muted">${s.brand.toLowerCase().replace(' ', '')}.example/sets/${s.num}</div></div><a class="btn sm" href="#">${I('ext')}Visit</a></div>` : `<div class="empty" style="padding:22px">No instructions saved for this set yet.</div>`;
const insActs = KID ? '' : `<button class="btn sm">${I('up2')}Upload PDF</button><button class="btn sm">${I('link')}Add link</button><button class="btn sm">${I('down2')}Save PDF from a link</button>`;

const html = `${head(s.name, `${s.brand} ${s.num}`, KID ? '' : `<button class="btn">${I('edit')}Edit set</button><button class="btn pri">${I('plus')}Add copy</button>`, crumbs)}
<div class="detailtop"><div><div class="cover">${boxArt(s)}</div>
<div class="row" style="margin-top:10px;justify-content:space-between;flex-wrap:wrap">${attrib}<span class="xs muted">Cover from the catalog</span></div></div>
<div><div class="facts"><div><div class="l">Year</div><div class="v">${s.year}</div></div><div><div class="l">Pieces</div><div class="v">${NUM(s.pcs)}</div></div><div><div class="l">Minifigs</div><div class="v">${s.figs || '-'}</div></div><div><div class="l">Age</div><div class="v">${s.age}+</div></div></div>
<p style="margin-top:16px;max-width:60ch">${DESC[s.id] || 'No description yet.'}</p>
<div class="chips" style="margin-top:14px">${s.tags.map((t) => `<span class="chip">${I('tag')}${t}</span>`).join('')}</div>
${KID ? '' : `<p class="sm muted" style="margin-top:14px">Retail price ${USD(s.rrp)} · designer: -</p>`}
${KID ? '' : `<div class="row" style="margin-top:18px;flex-wrap:wrap"><a class="btn" href="${href('shopping.html')}">${I('list')}Shopping list</a><button class="btn">${I('refresh')}Re-sync from catalog</button></div>`}</div></div>
<section aria-labelledby="ch"><div class="cardhead"><h2 id="ch">Copies <span class="muted" style="font-weight:400">${s.copies.length}</span></h2></div>${s.copies.map(copyCard).join('')}</section>
<section style="margin-top:34px" aria-labelledby="ih"><div class="cardhead" style="flex-wrap:wrap"><h2 id="ih">Instructions</h2><span class="sp"></span><a class="btn sm" href="#">${I('ext')}Find on ${FIND[s.brand]}</a></div>
<div class="card pad" style="padding-top:8px;padding-bottom:8px">${insRows}</div>${KID ? '' : `<div class="row" style="margin-top:12px;flex-wrap:wrap">${insActs}</div>`}</section>
${KID ? '' : `<p class="sm muted" style="margin-top:30px">Last edited by Dana on 12 Nov 2026 · <a href="#" style="text-decoration:underline">Activity for this set</a></p>`}`;
shell({ page: 'library', title: s.name, back: href('library.html'), html });
</script></body></html>
