<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Brick Bin mockups</title><link rel="stylesheet" href="style.css">
<style>body{padding:32px 20px}.w{max-width:980px;margin:0 auto}h1{font-size:30px;margin:14px 0 4px}h2{font-size:18px;margin:28px 0 10px}ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
li a{display:block;padding:10px 14px;border:1px solid var(--app-border);border-radius:10px;background:var(--app-surface);min-height:44px}li a:hover{border-color:var(--app-accent)}li a small{display:block;color:var(--app-muted);font-size:13px}</style></head>
<body><div class="w"><div class="brand" style="font:700 22px var(--head)"><span id="m"></span> Brick Bin mockups</div>
<h1>Design mockups, Phase 1</h1><p class="muted">Every page takes <code>?theme=dark</code> or <code>?theme=light</code> and <code>?role=kid</code> or <code>?role=member</code>. Resize the window to under 900px for the phone layout. All box art and data are invented.</p>
<div id="l"></div></div>
<script src="data.js"></script><script src="art.js"></script><script src="ui.js"></script>
<script>
document.getElementById('m').innerHTML = MARK.replace('<svg', '<svg width="28" height="28" style="display:inline-block;vertical-align:middle;color:var(--app-accent)"');
const G = [['1. Sign in and first run', [['signin.html', 'Sign in'], ['signin.html?state=error', 'Sign-in error'], ['signin.html?state=first', 'First-run setup']]],
['2-3. Library and filters', [['library.html', 'Library'], ['library.html?comp=missing', 'Filtered: missing pieces'], ['library.html?sheet=1&comp=missing', 'Phone filters sheet'], ['library.html?facets=all', 'All facets open']]],
['4. Set detail', [['set.html?id=s03&menu=1', 'Dune Rover, build-state menu open'], ['set.html?id=s02', 'Container Crane, missing pieces']]],
['5. Missing-part picker', [['missing.html', 'From this set'], ['missing.html?view=minifigs', 'Minifigs tab'], ['missing.html?view=catalog', 'Whole catalog'], ['missing.html?view=other', 'Other (free text)'], ['missing.html?view=list', "The copy's missing list (phone)"]]],
['6. Shopping list', [['shopping.html', 'Shopping list'], ['shopping.html?export=1', 'Exports menu'], ['shopping.html?trip=1', 'Store trip (phone)'], ['shopping.html?trip=1&done=1', 'Store trip: finish dialog']]],
['7. Add set', [['add.html', 'Catalog search'], ['add.html?step=scan', 'Barcode scan'], ['add.html?step=manual', 'Off-brand, by hand']]],
['8. Collection', [['collection.html', 'Collection and value']]],
['9. Wishlist', [['wishlist.html', 'Adult view of Wren'], ['wishlist.html?role=kid', "Wren's own list (kid)"], ['wishlist.html?dialog=got&who=Wren', '"We got it" dialog'], ['wishlist.html?who=Dana', "Dana's own list"]]],
['10. Settings > Catalog', [['catalog.html', 'Ready to import (paste panel)'], ['catalog.html?state=stale', 'Stale paste warning'], ['catalog.html?state=locked', 'Locked for 48 hours'], ['catalog.html?state=running', 'Import running'], ['catalog.html?state=never', 'First run']]],
['11. Kid profile', [['library.html?role=kid', 'Kid library'], ['set.html?role=kid&id=s02', 'Kid set detail']]],
['12. Smaller states', [['states.html?s=empty', 'Empty library'], ['states.html?s=trash', 'Trash'], ['states.html?s=delete', 'Delete confirmation'], ['states.html?s=people', 'People'], ['states.html?s=places', 'Places'], ['states.html?s=404', '404'], ['states.html?s=more', 'More (phone)'], ['brands.html', 'Brands and themes'], ['activity.html', 'Activity']]]];
document.getElementById('l').innerHTML = G.map(([t, l]) => `<h2>${t}</h2><ul>${l.map(([h, n]) => `<li><a href="${h}">${n}<small>${h}</small></a></li>`).join('')}</ul>`).join('');
</script></body></html>
