<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Missing pieces · Brick Bin</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"></div>
<script src="data.js"></script><script src="art.js"></script><script src="ui.js"></script>
<script>
/* ?view=inv|minifigs|catalog|other|list   (phone shows one pane at a time; desktop shows the picker and the copy's list side by side) */
const s = SETS.find((x) => x.id === 's02'); const c = s.copies[0];
const view = Q.get('view') || 'inv';
const missingQty = (num, col) => (c.m.find((r) => r[0] === num && r[1] === col) || [0, 0, 0])[2];
const sw = (col) => `<span class="sw" style="background:${COL[col].h}"></span>`;
const pname = (n) => `${PART[n].n}`;

function ptile(num, col, qty) {
  const have = missingQty(num, col);
  return `<div class="ptile ${have ? 'has' : ''}"><div class="pfr">${partImg(num, col)}</div>
  <div class="colrow">${sw(col)}<span>${COL[col].n}</span></div>
  <div><div class="no">${num}</div><div class="nm">${pname(num)}</div></div>
  <div class="qty"><span class="muted">In set</span><b>×${qty}</b>${have ? `<span class="b missing" style="margin-left:auto">${I('warn')}Missing ${have}</span>` : ''}</div>
  <div class="row"><div class="step" role="group" aria-label="Quantity"><button aria-label="Fewer">−</button><span>1</span><button aria-label="More">+</button></div><button class="btn soft sp">${I('plus')}Add</button></div></div>`;
}
const filters = `<div class="toolbar"><div class="searchbox">${I('search')}<input class="in" type="search" placeholder="Search part number or name" aria-label="Search this set's parts"></div>
 <span class="sel"><span class="muted">Colour</span> All</span><span class="sel"><span class="muted">Category</span> All</span><label class="tog" style="min-height:44px"><i></i>Show spares (${INV_META.spares})</label></div>`;
const inv = `${filters}<div class="ptiles" style="${PH ? '' : 'grid-template-columns:repeat(3,minmax(0,1fr))'}">${INV.map(([n, col, q]) => ptile(n, col, q)).join('')}</div>
<div class="row muted sm" style="margin-top:16px;justify-content:space-between;flex-wrap:wrap"><span>Showing ${INV.length} of ${INV_META.lines} part lines</span><button class="btn sm">Load more</button></div>`;
const figs = `<div class="ptiles" style="${PH ? '' : 'grid-template-columns:repeat(3,minmax(0,1fr))'}">${INV_META.figs.map((f) => `<div class="ptile"><div class="pfr" style="display:grid;place-items:center"><svg viewBox="0 0 120 90" style="width:100%;height:100%"><rect width="120" height="90" fill="#fff"/><circle cx="60" cy="22" r="11" fill="#e8c9a0"/><rect x="46" y="34" width="28" height="26" rx="4" fill="${f.c}"/><rect x="48" y="60" width="11" height="22" fill="#2c3a47"/><rect x="61" y="60" width="11" height="22" fill="#2c3a47"/><rect x="34" y="36" width="10" height="20" rx="4" fill="${f.c}"/><rect x="76" y="36" width="10" height="20" rx="4" fill="${f.c}"/></svg></div>
  <div><div class="no">${f.n}</div><div class="nm">Minifigure · in set ×${f.q}</div></div><div class="row"><div class="step"><button aria-label="Fewer">−</button><span>1</span><button aria-label="More">+</button></div><button class="btn soft sp">${I('plus')}Add</button></div></div>`).join('')}</div>`;

const knownCols = ['lbg', 'blk', 'wht', 'dbg', 'red', 'blu'];
const cat = (num, sel, fallback) => `<div class="card pad" style="margin-bottom:14px"><div class="row" style="align-items:flex-start;gap:16px;${PH ? 'flex-wrap:wrap' : ''}"><div class="pfr" style="width:150px;flex:none">${partImg(num, sel)}${fallback ? `<span class="shown">shown in Black</span>` : ''}</div>
  <div class="sp" style="min-width:200px"><div style="font-weight:700">${num} · ${pname(num)}</div><div class="sm muted" style="margin-bottom:10px">${PART[num].cat}</div>
  <div class="sm" style="font-weight:600;margin-bottom:6px">Colours this part is known in</div>
  <div class="chips">${knownCols.map((k) => `<span class="chip ${k === sel ? 'on' : ''}">${sw(k)}${COL[k].n}</span>`).join('')}<span class="chip">Other colours ${I('down')}</span></div>
  <div class="row" style="margin-top:14px"><div class="step"><button aria-label="Fewer">−</button><span>1</span><button aria-label="More">+</button></div><button class="btn pri">${I('plus')}Add ${COL[sel].n}</button></div></div></div></div>`;
const catalog = `<div class="notice info" style="margin-bottom:14px">${I('info')}<span>Use this for off-brand sets, sets not linked to the catalog, or a part that is not in this set's inventory.</span></div>
<div class="toolbar"><div class="searchbox">${I('search')}<input class="in" type="search" value="plate 2 x 4" aria-label="Search the whole parts catalog"></div></div>
${cat('3020', 'lbg')}${cat('3069b', 'wht')}${cat('54200', 'dor', true)}<div style="margin-top:6px">${attrib}</div>`;
const other = `<div class="card pad"><h2 style="margin-bottom:4px">Something the catalog does not have</h2><p class="muted" style="margin-bottom:16px">An off-brand special part, a sticker sheet, a printed tile you cannot find.</p>
<div class="field"><label>What is missing?</label><textarea class="in" rows="3" placeholder="For example: sticker sheet with the number plates">Sticker sheet with the number plates</textarea></div>
<div class="row" style="align-items:flex-end;flex-wrap:wrap"><div class="field" style="margin:0"><label>How many?</label><div class="step"><button aria-label="Fewer">−</button><span>1</span><button aria-label="More">+</button></div></div><button class="btn pri" style="margin-left:auto">${I('plus')}Add to missing</button></div></div>`;

const miss = [...c.m.map((r, i) => ({ r, i }))];
const mrow = ({ r, i }) => {
  const isO = r[0] === 'other';
  return `<div class="mrow"><div class="pfr">${isO ? `<div class="noart">${I('tag')}Other</div>` : partImg(r[0], r[1])}</div>
  <div style="min-width:0"><div style="font-weight:650">${isO ? r[1] : pname(r[0])}</div><div class="sm muted">${isO ? 'Not a catalog part' : `${r[0]}`}</div>${isO ? '' : `<div class="colrow" style="margin-top:4px">${sw(r[1])}<span>${COL[r[1]].n}</span></div>`}</div>
  <div class="q">×${r[2]}</div>
  <div class="acts" style="grid-column:1/-1;${PH ? '' : ''}"><button class="btn sm">${I('check')}Found</button><button class="btn sm">${I('bag')}Bought</button><button class="btn sm">Substituted</button><button class="btn sm ghost danger">${I('trash')}Remove</button></div>
  ${i === 0 ? `<div class="notice info" style="grid-column:1/-1">${I('info')}<span class="row" style="gap:10px;flex-wrap:wrap"><span>Found how many?</span><span class="step" style="background:var(--app-surface);color:var(--app-ink)"><button aria-label="Fewer">−</button><span>1</span><button aria-label="More">+</button></span><span>of ${r[2]}. The other ${r[2] - 1} stay missing.</span></span></div>` : ''}</div>`;
};
const total = c.missingN;
const listPane = `<div class="card pad" ${PH ? '' : 'style="position:sticky;top:24px"'}><div class="cardhead"><h2>Missing on this copy</h2><span class="sp"></span><span class="b missing lg">${I('warn')}${total} pieces</span></div>
${c.m.length ? miss.map(mrow).join('') : ''}
<div style="margin-top:14px;display:grid;gap:8px"><button class="btn lg" style="width:100%">${I('okc')}Everything else is here</button><div class="hint">Marks the copy as checked on ${TODAY}. It shows “Complete (checked Nov 2026)” once nothing is missing.</div></div></div>`;

const tabs = `<div class="tabs" role="tablist"><button role="tab" aria-selected="${view === 'inv'}">From this set</button><button role="tab" aria-selected="${view === 'minifigs'}">Minifigs <span class="b plain" style="margin-left:2px">${INV_META.figs.length}</span></button><button role="tab" aria-selected="${view === 'catalog'}">Whole catalog</button><button role="tab" aria-selected="${view === 'other'}">Other</button></div>`;
const picker = `<div>${tabs}${view === 'minifigs' ? figs : view === 'catalog' ? catalog : view === 'other' ? other : inv}${view === 'inv' || view === 'minifigs' ? `<div style="margin-top:14px">${attrib}</div>` : ''}</div>`;
const crumbs = `<a href="${href('library.html')}">Library</a>${I('right')}<a href="${href('set.html?id=s02')}">${s.name}</a>${I('right')}<span>Wren's copy</span>`;
let html = head('Missing pieces', `${s.brand} ${s.num} ${s.name} · Wren's copy · ${total} pieces missing`, '', crumbs);
if (PH) {
  html += `<div class="seg" style="width:100%;margin-bottom:14px"><button style="flex:1" aria-pressed="${view !== 'list'}">Add pieces</button><button style="flex:1" aria-pressed="${view === 'list'}">Missing (${total})</button></div>${view === 'list' ? listPane : picker}`;
} else html += `<div style="display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px;align-items:start">${picker}${listPane}</div>`;
shell({ page: 'library', title: 'Missing pieces', back: href('set.html?id=s02'), html });
</script></body></html>
