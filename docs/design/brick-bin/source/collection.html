<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Collection · Brick Bin</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"></div>
<script src="data.js"></script><script src="art.js"></script><script src="ui.js"></script>
<script>
const rows = COPIES.map((c) => ({ c, s: SETS.find((x) => x.id === c.setId) }));
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const paid = sum(rows, (r) => r.c.paid), est = sum(rows, (r) => r.c.value), diff = est - paid;
const pieces = sum(rows, (r) => r.s.pcs);
const group = (keyFn) => { const m = {}; rows.forEach((r) => { const k = keyFn(r); (m[k] = m[k] || { sets: new Set(), copies: 0, paid: 0, est: 0 }); m[k].sets.add(r.s.id); m[k].copies++; m[k].paid += r.c.paid; m[k].est += r.c.value; }); return Object.entries(m).sort((a, b) => b[1].est - a[1].est); };
const byBrand = group((r) => r.s.brand), byTheme = group((r) => r.s.theme[0]), byState = group((r) => r.c.state);
console.assert(sum(byBrand, (x) => x[1].est) === est, 'brand totals = est'); console.assert(sum(byTheme, (x) => x[1].paid) === paid, 'theme totals = paid');
console.assert(sum(byState, (x) => x[1].copies) === COPIES.length, 'states = copies');
const mon = (v) => new Date(v + '-15').toLocaleString('en-US', { month: 'short', year: 'numeric' });
const stale = rows.filter((r) => r.c.valued && r.c.valued < '2025-11').sort((a, b) => a.c.valued.localeCompare(b.c.valued));
const sealed = rows.filter((r) => r.c.state === 'sealed' && r.s.id !== 's09'); const sailN = rows.filter((r) => r.s.id === 's09').length;
const miss = rows.filter((r) => r.c.missingN > 0);
const tbl = (title, data, nameFn) => `<div class="card pad"><div class="cardhead"><h2>${title}</h2></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>${title === 'By brand' ? 'Brand' : 'Theme'}</th><th class="r">Sets</th><th class="r">Copies</th><th class="r">Paid</th><th class="r">Estimated</th><th class="r">Change</th></tr></thead><tbody>
${data.map(([k, v]) => `<tr><td style="font-weight:600">${nameFn ? nameFn(k) : k}</td><td class="r">${v.sets.size}</td><td class="r">${v.copies}</td><td class="r">${USD(v.paid)}</td><td class="r">${USD(v.est)}</td><td class="r muted">${USD(v.est - v.paid, true)}</td></tr>`).join('')}
<tr><td style="font-weight:700">All</td><td class="r"><b>${SETS.length}</b></td><td class="r"><b>${COPIES.length}</b></td><td class="r"><b>${USD(paid)}</b></td><td class="r"><b>${USD(est)}</b></td><td class="r"><b>${USD(diff, true)}</b></td></tr></tbody></table></div></div>`;
const maxS = Math.max(...byState.map((x) => x[1].copies));
const stateCard = `<div class="card pad"><div class="cardhead"><h2>By build state</h2><span class="sp"></span><span class="sm muted">${COPIES.length} copies</span></div>${byState.map(([k, v]) => `<div style="display:grid;grid-template-columns:140px minmax(0,1fr) 40px;gap:12px;align-items:center;margin:9px 0">${stateBadge(k)}<div class="bar"><i style="width:${v.copies / maxS * 100}%"></i></div><b class="r">${v.copies}</b></div>`).join('')}</div>`;
const list = (items, right, action) => items.map((r) => `<div class="insrow" style="padding:10px 0"><div style="width:72px;flex:none;border-radius:5px;overflow:hidden;border:1px solid var(--app-border);background:var(--app-sunk)">${boxArt(r.s)}</div><div class="sp" style="min-width:0"><div style="font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.s.name}</div><div class="sm muted">${r.s.brand} ${r.s.num} · ${r.c.owner || 'Ours'}</div></div><div class="r sm">${right(r)}</div></div>`).join('');
const html = `${head('Collection', `<b style="color:var(--app-ink)">We paid ${USD(paid)} and it is worth about ${USD(est)} today, ${USD(diff, true)}.</b> Estimates are entered by hand, ${stale.length} are over a year old.`, `<button class="btn">${I('down2')}Export CSV</button>`)}
<div class="kpis" style="margin-bottom:var(--gap)"><div><div class="l">Estimated value</div><div class="v" style="font-size:32px">${USD(est)}</div><div class="d">${USD(diff, true)} against paid</div></div><div><div class="l">Paid</div><div class="v">${USD(paid)}</div><div class="d">${COPIES.length} copies</div></div><div><div class="l">Sets</div><div class="v">${SETS.length}</div><div class="d">${COPIES.length} copies, ${sailN} are one polybag</div></div><div><div class="l">Pieces</div><div class="v">${NUM(pieces)}</div><div class="d">sum of set piece counts, per copy</div></div></div>
<div class="grid2" style="align-items:start"><div style="display:grid;gap:var(--gap)">${tbl('By brand', byBrand)}${tbl('By theme', byTheme)}</div>
<div style="display:grid;gap:var(--gap)">${stateCard}
<div class="card pad"><div class="cardhead"><h2>Value not set in over a year</h2><span class="sp"></span><span class="pill bad">${I('clock')}${stale.length} copies</span></div>${list(stale, (r) => `<div>${USD(r.c.value)}</div><div class="muted xs">valued ${mon(r.c.valued)}</div>`)}</div>
<div class="card pad"><div class="cardhead"><h2>Copies with missing pieces</h2><span class="sp"></span><a class="btn sm" href="${href('shopping.html')}">${I('list')}Shopping list</a></div>${list(miss, (r) => `<span class="b missing">${I('warn')}${r.c.missingN} missing</span>`)}</div>
<div class="card pad"><div class="cardhead"><h2>Sealed</h2><span class="sp"></span><span class="sm muted">${sealed.length} sets + ${sailN} polybags</span></div>${list(sealed, (r) => `<div>${USD(r.c.value)}</div><div class="muted xs">paid ${USD(r.c.paid)}</div>`)}<p class="sm muted" style="margin-top:8px">Mini Sailboat polybags: ${sailN} copies, ${USD(sailN * 700)} estimated.</p></div></div></div>
<p class="sm muted" style="margin-top:20px">Members and admins only. Kid profiles never see prices or this page.</p>`;
shell({ page: 'collection', title: 'Collection', html });
</script></body></html>
