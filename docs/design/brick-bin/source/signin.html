<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Sign in · Brick Bin</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"></div>
<script src="data.js"></script><script src="art.js"></script><script src="ui.js"></script>
<script>
/* ?state=signin|error|first */
const st = Q.get('state') || 'signin';
const wall = [['s05', 's01', 's14'], ['s13', 's18', 's07'], ['s12', 's20', 's16']].map((r) => `<div class="plank">${r.map((id) => { const s = SETS.find((x) => x.id === id); return `<div class="tile"><div class="frame">${boxArt(s)}</div></div>`; }).join('')}</div>`).join('');
const err = st === 'error' ? `<div class="notice bad" role="alert" style="margin-bottom:16px">${I('warn')}<span><b>That email and password do not match.</b> Check them and try again. Passwords are case sensitive.</span></div>` : '';
const signin = `<h1>Welcome back</h1><p class="muted" style="margin-bottom:22px">Sign in to the ${HOUSEHOLD}'s bin.</p>${err}
<div class="field"><label for="e">Email</label><input id="e" class="in ${st === 'error' ? 'err' : ''}" value="${st === 'error' ? 'dana@marlowe.example' : ''}" placeholder="you@example.com"></div>
<div class="field"><label for="p">Password</label><input id="p" class="in" type="password" value="${st === 'error' ? 'password' : ''}"></div>
<button class="btn pri lg" style="width:100%">Sign in</button><p class="sm muted" style="margin-top:16px">Forgot it? Ask an admin to set a new one in People.</p>`;
const first = `<div class="stepsline" aria-label="Step 1 of 2"><i class="on"></i><i></i></div><div class="xs muted" style="margin-bottom:2px">First run · step 1 of 2</div><h1 style="margin-top:6px">Set up your bin</h1><p class="muted" style="margin-bottom:20px">Nothing is stored anywhere but on this server. You become the admin.</p>
<div class="field"><label>Household name</label><input class="in" value="Marlowe household"><span class="hint">Shown in the sidebar. You can change it later.</span></div>
<div class="field"><label>Your name</label><input class="in" value="Dana"></div><div class="field"><label>Email</label><input class="in" placeholder="you@example.com"></div>
<div class="field"><label>Password</label><input class="in" type="password" value="••••••••••"><span class="hint">At least 10 characters.</span></div>
<div class="notice info" style="margin-bottom:18px">${I('info')}<span>LEGO is added as your first brand. Add others, like Mould King or CaDA, when you add a set.</span></div>
<button class="btn pri lg" style="width:100%">Create household</button>`;
const html = `<div class="auth"><div class="authwall" aria-hidden="true">${wall}</div><div class="authform"><div class="brand">${MARK}Brick Bin</div>${st === 'first' ? first : signin}
<div class="pagefoot" style="margin-top:34px;border:0;padding:0"><span>Catalog data from <a href="https://rebrickable.com">Rebrickable</a></span><span>Box art on this page is invented.</span></div></div></div>`;
document.getElementById('app').innerHTML = html; document.title = 'Sign in · Brick Bin';
</script></body></html>
