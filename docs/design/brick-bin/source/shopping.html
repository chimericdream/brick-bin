<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Shopping list · Brick Bin</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"></div>
<script src="data.js"></script><script src="art.js"></script><script src="ui.js"></script>
<script>
/* ?sort=colour|category|set   ?export=1 (menu open)   ?trip=1 (store-trip mode)   ?done=1 (trip finish dialog) */
const sg = shoppingGroups(ROLE); const sort = Q.get('sort') || 'colour';
const groups = sg.groups.slice().sort((a, b) => COL[a.col].n.localeCompare(COL[b.col].n) || a.part.localeCompare(b.part));
const total = groups.reduce((a, g) => a + g.q, 0) + sg.others.reduce((a, g) => a + g.q, 0);
const copyN = new Set(groups.flatMap((g) => g.from.map((f) => f.copy.id))).size;
const sw = (col) => `<span class="sw" style="background:${COL[col].h}"></span>`;
const needs = (g) => g.from.map((f) => `<b>${f.set.name}</b> ×${f.q}`).join(', ');
const ticked = ['3020|lbg', '2780|blk', '3069b|wht'];
const key = (g) => g.part + '|' + g.col;

function row(g) {
  const mold = MOLD[g.part] ? `<div class="hint row" style="gap:6px;margin-top:3px">${I('info')}${MOLD[g.part]}</div>` : '';
  return `<div class="shrow"><div class="pfr">${partImg(g.part, g.col)}</div>
  <div style="min-width:0"><div style="font-weight:650">${PART[g.part].n}</div><div class="sm muted">${g.part} · ${PART[g.part].cat}</div><div class="colrow" style="margin-top:4px">${sw(g.col)}<span>${COL[g.col].n}</span></div>${mold}</div>
  <div class="need"><span class="muted">Needed for</span> ${needs(g)}</div><div class="q">${g.q}<small>pieces</small></div></div>`;
}
function body() {
  let out = '';
  if (sort === 'colour') {
    const byC = {}; groups.forEach((g) => (byC[g.col] = byC[g.col] || []).push(g));
    Object.keys(byC).forEach((col) => { out += `<div class="row" style="margin:22px 0 0;gap:10px">${sw(col)}<h2 style="font-size:17px">${COL[col].n}</h2><span class="muted sm">${byC[col].reduce((a, g) => a + g.q, 0)} ${byC[col].reduce((a, g) => a + g.q, 0) === 1 ? "piece" : "pieces"}</span></div>${byC[col].map(row).join('')}`; });
  } else out = groups.map(row).join('');
  out += `<div class="row" style="margin:26px 0 4px;gap:10px;flex-wrap:wrap"><h2 style="font-size:17px">Other items</h2><span class="muted sm">Not catalog parts, so not in the exports</span></div>${sg.others.map((o) => `<div class="shrow"><div class="pfr"><div class="noart">${I('tag')}Other</div></div><div><div style="font-weight:650">${o.text}</div><div class="sm muted">Not a catalog part</div></div><div class="need"><span class="muted">Needed for</span> <b>${o.set.name}</b> ×${o.q}</div><div class="q">${o.q}<small>piece</small></div></div>`).join('')}`;
  return out;
}
const exportMenu = `<div class="menu" style="position:absolute;right:0;top:44px;z-index:10;width:min(340px,calc(100vw - 32px))" role="menu"><button role="menuitem">${I('down2')}<span class="t">BrickLink wanted list (XML)<small>For “Upload wanted list”. 1 part has no BrickLink id and is left out.</small></span></button>
<button role="menuitem">${I('down2')}<span class="t">Rebrickable parts list (CSV)<small>Part, Color, Quantity</small></span></button><button role="menuitem">${I('down2')}<span class="t">Plain CSV<small>Part, colour, element id, quantity, sets, notes</small></span></button><button role="menuitem">${I('print')}<span class="t">Print view<small>One page, grouped by ${sort}</small></span></button></div>`;

if (Q.get('trip')) {
  const rows = groups.map((g) => { const on = ticked.includes(key(g)); return `<div class="triprow ${on ? 'done' : ''}"><div class="tickbox ${on ? 'on' : ''}" role="checkbox" aria-checked="${on}" aria-label="${PART[g.part].n}, ${COL[g.col].n}">${on ? '<svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>' : ''}</div><div class="pfr">${partImg(g.part, g.col)}</div>
    <div style="min-width:0"><div class="row" style="gap:10px;align-items:baseline"><span class="tq">×${g.q}</span><span class="sm muted">${g.part}</span></div><div class="tn">${PART[g.part].n}</div><div class="colrow" style="margin-top:3px">${sw(g.col)}<span>${COL[g.col].n}</span></div></div></div>`; }).join('');
  const tickedQ = groups.filter((g) => ticked.includes(key(g)));
  const nt = tickedQ.reduce((a, g) => a + g.q, 0);
  const alloc = tickedQ.map((g) => `<div style="padding:10px 0;border-bottom:1px solid var(--app-rule)"><div class="row" style="gap:10px"><span class="sw" style="background:${COL[g.col].h}"></span><b>${g.q}× ${PART[g.part].n}</b></div><div class="sm muted" style="margin-left:28px">${g.from.map((f) => `${f.set.name} ×${f.q}`).join(' then ')}</div></div>`).join('');
  const dlg = Q.get('done') ? `<div class="scrim"></div><div class="sheet" role="dialog" aria-label="Mark ticked as bought"><div class="grab"></div><div class="sh"><h2>Mark ${tickedQ.length} parts as Bought?</h2></div><div class="sb"><p class="muted sm" style="margin-bottom:6px">${nt} pieces. Each part fills the oldest missing rows first. You can change that.</p>${alloc}<div class="notice info" style="margin-top:12px">${I('info')}<span>Ticks live in this browser only. Unticked parts stay on the list.</span></div></div><div class="sf"><button class="btn">Not yet</button><button class="btn pri">${I('bag')}Mark as Bought</button></div></div>` : '';
  const html = `<div class="trip"><div class="row" style="margin-bottom:8px"><span class="sm muted">Colour order · ${total} pieces</span></div><div class="prog" style="margin-bottom:6px"><div class="bar"><i style="width:${(tickedQ.length / groups.length * 100).toFixed(0)}%"></i></div><b class="sm nw">${tickedQ.length} of ${groups.length} parts</b></div>${rows}<div style="margin-top:14px">${attrib}</div></div>
  <div class="tripbar"><button class="btn lg sp pri">${I('check')}Done: mark ticked as Bought</button></div>`;
  shell({ page: 'shopping', title: 'Store trip', back: href('shopping.html'), topAct: `<span class="b plain">${I('bag')}Trip</span>`, html, nofoot: true, after: dlg });
} else {
  const acts = `<span class="menuhost" style="position:relative"><button class="btn" aria-haspopup="menu" aria-expanded="${!!Q.get('export')}">${I('down2')}Export${I('down')}</button>${Q.get('export') ? exportMenu : ''}</span><button class="btn">${I('print')}Print</button><a class="btn pri show-m" href="${href('shopping.html?trip=1')}" style="flex:1">${I('bag')}Start store trip</a>`;
  const html = `${head('Shopping list', `${total} pieces to find across ${copyN} copies: ${groups.reduce((a, g) => a + g.q, 0)} catalog parts in ${groups.length} lines, ${sg.others.reduce((a, g) => a + g.q, 0)} other item.${KID ? ' You can look but not change it.' : ''}`, KID ? '' : acts)}
  <div class="toolbar"><span class="sel"><span class="muted">Sets</span> All sets (6 with missing pieces)</span><span class="sel hide-m"><span class="muted">Brand</span> All</span><span class="sel hide-m"><span class="muted">Colour</span> All</span>
  <span class="sp"></span><div class="seg" role="group" aria-label="Sort by"><button aria-pressed="${sort === 'colour'}">Colour</button><button aria-pressed="${sort === 'category'}">Category</button><button aria-pressed="${sort === 'set'}">Set</button></div></div>
  <div class="card pad" style="padding-top:2px;padding-bottom:10px">${body()}</div>
  <div class="row" style="margin-top:14px;justify-content:space-between;flex-wrap:wrap">${attrib}<span class="xs muted">Alternates come from catalog part relationships.</span></div>`;
  shell({ page: 'shopping', title: 'Shopping list', html });
}
</script></body></html>
