<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Library · Brick Bin</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"></div>
<script src="data.js"></script><script src="art.js"></script><script src="ui.js"></script>
<script>
/* ?comp=missing|complete|unchecked|sealed  ?build=<state>  ?theme_=Technic  ?brand=LEGO  ?q=text  ?sheet=1  ?sort=name|num|year|pcs|new|value  ?select=1 */
const all = visibleSets(ROLE);
const f = { comp: Q.get('comp'), build: Q.get('build'), th: Q.get('th'), brand: Q.get('brand'), q: (Q.get('q') || '').toLowerCase() };
const compOf = (s) => s.copies.map(completeness).map((c) => c.k);
const natural = (a, b) => a.num.localeCompare(b.num, undefined, { numeric: true });
const sorters = { name: (a, b) => a.name.localeCompare(b.name), num: natural, year: (a, b) => b.year - a.year, pcs: (a, b) => b.pcs - a.pcs, new: (a, b) => b.copies[0].acq.localeCompare(a.copies[0].acq), value: (a, b) => b.copies.reduce((x, c) => x + c.value, 0) - a.copies.reduce((x, c) => x + c.value, 0) };
const sortKey = Q.get('sort') || 'name';
const SORTN = { name: 'Name', num: 'Set number', year: 'Year, newest', pcs: 'Pieces, most', new: 'Recently added', value: 'Estimated value' };
let list = all.filter((s) => (!f.comp || compOf(s).includes(f.comp)) && (!f.build || s.copies.some((c) => c.state === f.build)) && (!f.th || s.theme[0] === f.th) && (!f.brand || s.brand === f.brand) && (!f.q || (s.name + s.num + s.brand + s.theme.join(' ')).toLowerCase().includes(f.q))).sort(sorters[sortKey]);
const copiesN = list.reduce((a, s) => a + s.copies.length, 0);
const missingSets = all.filter((s) => compOf(s).includes('missing'));
const cnt = (fn) => all.filter(fn).length;

/* facet groups: every count is computed from the same rows as the tiles */
const brands = [...new Set(all.map((s) => s.brand))].map((b) => [b, cnt((s) => s.brand === b)]);
const themes = [...new Set(all.map((s) => s.theme[0]))].sort().map((t) => ({ t, n: cnt((s) => s.theme[0] === t), kids: [...new Set(all.filter((s) => s.theme[0] === t && s.theme[1]).map((s) => s.theme[1]))].map((k) => [k, cnt((s) => s.theme[0] === t && s.theme[1] === k)]) }));
const builds = Object.keys(STATES).map((k) => [STATES[k].l, cnt((s) => s.copies.some((c) => c.state === k)), k]);
const comps = [['Missing pieces', cnt((s) => compOf(s).includes('missing')), 'missing'], ['Complete', cnt((s) => compOf(s).includes('complete')), 'complete'], ['Not checked', cnt((s) => compOf(s).includes('unchecked')), 'unchecked']];
const locs = [...new Set(all.flatMap((s) => s.copies.map((c) => c.loc.split(' › ')[0])))].map((l) => [l, cnt((s) => s.copies.some((c) => c.loc.startsWith(l)))]);
const owners = [...new Set(all.flatMap((s) => s.copies.map((c) => c.owner || 'Ours')))].map((o) => [o, cnt((s) => s.copies.some((c) => (c.owner || 'Ours') === o))]);
const bands = [['Under 250', (s) => s.pcs < 250], ['250 to 999', (s) => s.pcs >= 250 && s.pcs < 1000], ['1,000 to 2,999', (s) => s.pcs >= 1000 && s.pcs < 3000], ['3,000 and up', (s) => s.pcs >= 3000]].map(([l, fn]) => [l, cnt(fn)]);
const tags = [...new Set(all.flatMap((s) => s.tags))].map((t) => [t, cnt((s) => s.tags.includes(t))]);
const insYes = cnt((s) => s.ins > 0);
const years = [Math.min(...all.map((s) => s.year)), Math.max(...all.map((s) => s.year))];
const sum3 = (arr) => arr.reduce((a, x) => a + x[1], 0);
console.assert(sum3(bands) === all.length, 'bands add up'); console.assert(sum3(brands) === all.length, 'brands add up');

const grp = (title, body, open) => `<details ${open ? 'open' : ''}><summary>${title}</summary><div class="opts">${body}</div></details>`;
const opts = (arr, on) => arr.map(([l, n, k]) => cb(l, n, on && (on === k || on === l))).join('');
function facetHTML(all_) {
  const theme = themes.map((t) => cb(t.t, t.n, f.th === t.t, 'l0') + t.kids.map(([k, n]) => cb(k, n, false, 'l1')).join('')).join('');
  return `<div class="fhead"><b style="font-size:16px">Filters</b><span class="sp"></span>${f.comp || f.build || f.th || f.brand ? '<a class="btn ghost sm" href="library.html">Clear all</a>' : ''}</div>
  <div style="padding:6px 0 10px">${`<label class="tog"><i></i>Include sets with no copies</label>`}<div class="hint" style="margin-top:4px">Showing sets we own. ${all.filter((s) => s.copies.length).length} of ${all.length}.</div></div>
  ${grp('Brand', opts(brands, f.brand), true)}
  ${grp('Theme', `<div class="tree">${theme}</div>`, true)}
  ${grp('Build state', opts(builds, f.build), true)}
  ${grp('Completeness', opts(comps, f.comp), true)}
  ${grp('Location', opts(locs), all_)}
  ${grp('Owner', opts(owners), all_)}
  ${grp('Year', `<div class="row"><input class="in" aria-label="From year" value="${years[0]}" style="width:90px"><span class="muted">to</span><input class="in" aria-label="To year" value="${years[1]}" style="width:90px"></div>`, all_)}
  ${grp('Pieces', opts(bands), all_)}
  ${grp('Tags', opts(tags), all_)}
  ${grp('Instructions', cb('Has instructions', insYes) + cb('No instructions yet', all.length - insYes), all_)}`;
}
const activeChips = [f.comp && ['Completeness', comps.find((c) => c[2] === f.comp)[0]], f.build && ['Build state', STATES[f.build].l], f.th && ['Theme', f.th], f.brand && ['Brand', f.brand]].filter(Boolean)
  .map(([a, b]) => `<span class="chip on">${a}: ${b} ${I('x')}</span>`).join('');
const nf = [f.comp, f.build, f.th, f.brand].filter(Boolean).length;

const sortSel = `<span class="sel"><span class="muted">Sort</span> ${SORTN[sortKey]}</span>`;
const sub = `${list.length} ${list.length === 1 ? 'set' : 'sets'} · ${copiesN} copies${KID ? '' : ''}`;
const finding = nf || f.q ? '' : `<a href="${href('library.html?comp=missing')}" style="color:var(--app-accent-ink);text-decoration:underline;text-underline-offset:3px;font-weight:600">${missingSets.length} sets have missing pieces</a>`;
const tools = `<div class="toolbar"><div class="searchbox">${I('search')}<input class="in" type="search" placeholder="Search sets, numbers, brands" aria-label="Search sets" value="${Q.get('q') || ''}"></div>
  <button class="btn show-m" style="flex:none">${I('filter')}Filters${nf ? ` · ${nf}` : ''}</button>${sortSel}</div>`;
const selecting = Q.get('select');

const body = `${head('Library', `${sub}${finding ? ' · ' + finding : ''}`, KID ? '' : `<button class="btn hide-m">${I('list')}Shopping list for these…</button><a class="btn pri hide-m" href="${href('add.html')}">${I('plus')}Add set</a>`)}
<div class="lib"><aside class="facets desk" aria-label="Filters">${facetHTML(Q.get('facets') === 'all')}</aside>
<section>${tools}${nf ? `<div class="activef">${activeChips}<a class="btn ghost sm" href="library.html">Clear all</a></div>` : ''}
${list.length ? planks(list.map((s, i) => tile(s, selecting ? { select: true, on: ['s02', 's04', 's11'].includes(s.id) } : {}))) : `<div class="empty"><h3>Nothing matches</h3>No sets match these filters.<br><a class="btn" href="library.html">Clear filters</a></div>`}
<div class="row muted sm" style="justify-content:space-between;flex-wrap:wrap"><span>Showing ${list.length} of ${list.length}</span>${attrib}</div></section></div>`;

let after = '';
if (Q.get('sheet')) {
  after = `<div class="scrim"></div><div class="sheet" role="dialog" aria-label="Filters"><div class="grab"></div><div class="sh"><h2>Filters</h2><span class="sp"></span><button class="btn ghost sm">Clear all</button><button class="iconbtn" aria-label="Close" style="margin:0">${I('x')}</button></div>
  <div class="sb facets" style="position:static;max-height:none">${facetHTML(false).replace(/<div class="fhead">.*?<\/div>\s*<div style="padding:6px 0 10px">/s, '<div style="padding:0 0 10px">')}</div>
  <div class="sf"><button class="btn">Clear</button><button class="btn pri">Show ${list.length} sets</button></div></div>`;
}
shell({ page: 'library', title: PH ? 'Library' : '', topAct: PH && !KID ? `<button class="iconbtn" aria-label="Select sets">${I('list')}</button>` : '', html: body, after });
if (PH && !Q.get('title')) document.querySelector('.topbar').innerHTML = `<a class="brand" href="library.html">${MARK}Brick Bin</a><span class="sp"></span>${KID ? '<span class="xs muted">Wren</span>' : `<a class="iconbtn" href="${href('add.html')}" aria-label="Add set">${I('plus')}</a>`}`;
</script></body></html>
