<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Catalog · Brick Bin</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"></div>
<script src="data.js"></script><script src="art.js"></script><script src="ui.js"></script>
<script>
/* ?state=available (default, clock 17 Nov 2026) | stale | locked (clock 16 Nov) | running | never */
const st = Q.get('state') || 'available';
const never = st === 'never', running = st === 'running', locked = st === 'locked', stale = st === 'stale';
const header = never
  ? `<div class="bigline">Never imported</div><p class="muted" style="margin-top:6px">Set lookup and part picking need the catalog.</p>`
  : `<div class="bigline">Last imported 15 Nov 2026, 7:18 a.m. <span class="muted" style="font-weight:500">(${locked ? '1 day' : '2 days'} ago)</span></div><p class="muted" style="margin-top:6px">Rebrickable's own catalog was last updated <b style="color:var(--app-ink)">15 Nov 2026</b>. Imports are manual and at most once every 48 hours.</p>`;
const stats = never ? '' : `<div class="kpis" style="margin-top:20px"><div><div class="l">Sets</div><div class="v">26,412</div></div><div><div class="l">Parts</div><div class="v">63,985</div></div><div><div class="l">Colours</div><div class="v">232</div></div><div><div class="l">Catalog images</div><div class="v">5.9 <small>GB</small></div><div class="d">142 GB free in the data folder</div></div></div>`;
const firstWarn = never ? `<div class="notice" style="margin-top:20px">${I('warn')}<span><b>The first import downloads about 6 GB.</b> That is the catalog files plus 196 colour folders of part images. Free space in the data folder: <b>142 GB</b>. It can take an hour or more, and it keeps going if you close this page.</span></div>` : '';
let action;
if (running) {
  action = `<div class="card pad"><div class="cardhead"><h2>Import running</h2><span class="pill plain">${I('refresh')}Started 7:18 a.m.</span></div>
  <div class="prog"><div class="bar"><i style="width:${(41 / 196 * 100).toFixed(1)}%"></i></div><b class="nw">41 of 196</b></div>
  <p style="margin-top:10px;font-weight:650">Import running: 41 of 196 colour files</p><p class="sm muted">Now unpacking Dark Bluish Gray (parts_72.zip, 98 MB). The catalog tables were replaced earlier in this run.</p>
  <ul style="list-style:none;padding:0;margin-top:12px;display:grid;gap:6px" class="sm"><li class="row">${I('okc')}Read the downloads list</li><li class="row">${I('okc')}Downloaded and loaded the CSV archive (15 files)</li><li class="row">${I('okc')}Saved the schema diagram</li><li class="row">${I('refresh')}<b>Colour images: 41 of 196</b></li></ul>
  <p class="hint" style="margin-top:12px">You can leave this page. If the server restarts, the run is marked interrupted and you can start again.</p></div>`;
} else {
  const btn = locked ? `<button class="btn lg dis" disabled>${I('clock')}Available again 17 Nov 2026, 7:18 a.m.</button>` : `<button class="btn pri lg">${I('down2')}Import catalog</button>`;
  const pasted = `&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
  &lt;meta charset="utf-8"&gt;
  &lt;title&gt;Rebrickable - Downloads&lt;/title&gt;
  ...
  &lt;a href="https://cdn.rebrickable.com/media/downloads/all_downloads.zip?1763191080"&gt;
  &lt;img src="/static/img/diagrams/downloads_schema_v4.svg" alt="Public CSV schema ..."&gt;
  &lt;a href="https://cdn.rebrickable.com/media/downloads/ldraw/parts_31.zip"
     aria-label="Download LDraw images in Lavender as ZIP"&gt;
  ...`;
  action = `<div class="card pad" ${locked ? 'aria-disabled="true"' : ''}><div class="cardhead"><h2>Paste the downloads page</h2></div>
  <p class="muted" style="margin-bottom:12px">Brick Bin does not open Rebrickable's website by itself. You copy the page once and paste it here, and the app downloads only the files it lists.</p>
  <ol class="steps"><li><span>Open <b>rebrickable.com/downloads</b> in your browser.</span></li><li><span>View the page source: press <span class="kbd">Ctrl</span> + <span class="kbd">U</span> (<span class="kbd">⌘</span> + <span class="kbd">⌥</span> + <span class="kbd">U</span> on a Mac).</span></li><li><span>Select everything (<span class="kbd">Ctrl</span> + <span class="kbd">A</span>) and copy it.</span></li><li><span>Paste it below. About 240 KB, limit 2 MB.</span></li></ol>
  <label class="vh" for="ta">Downloads page HTML</label>
  <textarea id="ta" class="ta mono" ${locked ? 'disabled' : ''} placeholder="Paste the page source here">${locked || never ? '' : pasted}</textarea>
  ${locked || never ? '' : stale
    ? `<div class="notice" style="margin-top:14px" role="alert">${I('warn')}<span class="sp"><b>This page looks older than your last import.</b> It says the catalog was updated 12 Nov 2026, but you imported 15 Nov 2026. You may have pasted a saved copy.<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn sm">Paste again</button><button class="btn sm">Import anyway</button></div></span></div>`
    : `<div class="notice info" style="margin-top:14px">${I('check')}<span class="sp"><b>This run will:</b> download the CSV archive (updated 15 Nov 2026), the schema diagram, and 12 of 196 colour ZIPs that changed (1.1 GB). The other 184 colours are kept as they are. Only rebrickable.com addresses are used; anything else on the pasted page is ignored.</span></div>`}
  <div class="row" style="margin-top:16px;flex-wrap:wrap">${btn}${never ? '<span class="hint">Paste the page above first</span>' : ''}</div></div>`;
}
const hist = never ? `<div class="empty">No imports yet. Runs appear here.</div>` : `<div class="card pad"><div class="cardhead"><h2>Run history</h2></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Started</th><th>By</th><th>Result</th><th class="r">Downloaded</th><th class="r">Skipped</th><th>Note</th></tr></thead><tbody>
<tr><td class="nw">15 Nov 2026, 7:18 a.m.</td><td>Dana</td><td><span class="pill ok">${I('check')}Succeeded</span></td><td class="r">14</td><td class="r">184</td><td class="muted nw">12 colour ZIPs changed</td></tr>
<tr><td class="nw">29 Oct 2026, 6:52 p.m.</td><td>Dana</td><td><span class="pill ok">${I('check')}Succeeded</span></td><td class="r">9</td><td class="r">189</td><td class="muted nw">7 colour ZIPs changed</td></tr>
<tr><td class="nw">12 Oct 2026, 8:05 a.m.</td><td>Theo</td><td><span class="pill bad">${I('x')}Failed</span></td><td class="r">61</td><td class="r">0</td><td class="nw">Interrupted: server restarted</td></tr>
<tr><td class="nw">11 Oct 2026, 9:30 a.m.</td><td>Dana</td><td><span class="pill ok">${I('check')}Succeeded</span></td><td class="r">198</td><td class="r">0</td><td class="muted nw">First import, 5.9 GB</td></tr></tbody></table></div></div>`;
const html = `${head('Catalog', 'The part and set data behind lookups, the part picker and the shopping list.', '', '')}
<div class="sets">${subnav('catalog')}<div style="display:grid;gap:var(--gap);min-width:0">
<div class="card pad">${header}${stats}${firstWarn}<div class="row" style="margin-top:16px;gap:20px;flex-wrap:wrap"><a class="row sm" style="gap:6px;color:var(--app-accent-ink);text-decoration:underline" href="#">${I('file')}How the files fit together (schema diagram)</a></div></div>
${action}${hist}
<p class="sm muted">Catalog data from <a href="https://rebrickable.com" style="text-decoration:underline">Rebrickable</a>. Free to use if Rebrickable is credited, and it is, in the footer and wherever catalog data is shown.</p></div></div>`;
shell({ page: 'catalog', title: 'Catalog', back: href('more.html'), html });
</script></body></html>
