# Marketing and docs site (brick-bin.app). Netlify builds from the repository root because the site
# is a pnpm workspace package; the app itself is never deployed here.
[build]
command = "pnpm install --frozen-lockfile && pnpm --filter brick-bin-site build"
publish = "site/out"
# Skip the build when nothing the site uses has changed (exit 0 = skip).
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site netlify.toml pnpm-lock.yaml pnpm-workspace.yaml"

[build.environment]
NODE_VERSION = "24"

# The header's Docs link goes to Setup; send a bare /docs there too.
[[redirects]]
from = "/docs"
to = "/docs/setup/"
status = 301

[[redirects]]
from = "/docs/"
to = "/docs/setup/"
status = 301

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
